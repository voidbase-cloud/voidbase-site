# GitHub only starts builds; Cloudflare Workers Builds runs them. Every push builds the project (`bun run build`,
# then `bun run check`, which extends the generated .voidbase/tsconfig.json); a push to master also deploys the Worker (`bun run deploy:ci`: `voidbase deploy` from .voidbase/,
# which serves the site at /, the API at /api and the admin panel at /_/). The app's configuration is declared in
# vb_secrets/main.ts: its secrets are the Worker's own, stored once from a maintainer's machine (`bun run deploy`, or
# `voidbase secrets push` from .voidbase/); its vars are set by every deploy from the declared defaults and the
# build's environment. So the build needs only the deploy token, VOIDBASE_DEPLOY_CF_API_KEY, and VB_ADMIN_EMAILS
# (the deploy target is declared with defaults), both on the master trigger of the Cloudflare
# project (dashboard: Workers > voidbase-site > Settings > Builds). The variable and the secret below point at that
# account: CF_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables) and CLOUDFLARE_BUILDS_TOKEN (a user
# API token with Workers Builds Configuration: Edit and Workers Scripts: Read). The trigger itself is looked up at run
# time by the Worker's name and the branch rather than kept as a uuid: renaming the Worker once gave it new triggers,
# and the stored uuid pointed at nothing. Until the variable exists the job is skipped, and a fork deploys from its
# owner's machine with `bun run deploy`.
name: cloudflare
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  start:
    if: vars.CF_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://api.cloudflare.com/client/v4/accounts/${{ vars.CF_ACCOUNT_ID }}/builds
      TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
      COMMIT: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
      WAIT: ${{ vars.CF_BUILDS_WAIT }}
      WORKER: voidbase-site
    steps:
      - uses: actions/checkout@v4
      # master deploys; every other branch is checked and built on the branches trigger. The Builds API names a
      # Worker by its script tag, so the name is resolved first; a trigger naming the branch beats one taking "*".
      - name: Start the build
        env:
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: scripts/cf-build.sh "$BRANCH" "$COMMIT"
      # A build Cloudflare declines to run comes back "skipped", which is not "fail", so the job would go green
      # while nothing deployed: one commit went out that way before this step existed. Only the outcome is
      # trustworthy here, not a reason for it, so this reports the fact and points at the dashboard.
      - name: Say so if Cloudflare skipped it
        run: |
          sleep 90
          outcome=$(curl -sS "$API/builds/$uuid" -H "Authorization: Bearer $TOKEN" | jq -r '.result.build_outcome // empty')
          [ "$outcome" != "skipped" ] || {
            echo "cloudflare skipped build $uuid, so $COMMIT did not deploy."
            echo "see Workers > $WORKER > Settings > Builds for why, then push again or start a build there."
            exit 1
          }
          echo "cloudflare: build $uuid is ${outcome:-running}"
      - name: Wait for the build (repository variable CF_BUILDS_WAIT=1)
        if: env.WAIT == '1'
        run: |
          unknown=0
          while :; do
            # a finished build has status "stopped" and build_outcome "success" or "fail"
            status=$(curl -sS "$API/builds/$uuid" -H "Authorization: Bearer $TOKEN" | jq -r 'if .result.status == "stopped" then (.result.build_outcome // "fail") else (.result.status // empty) end')
            case "$status" in
              success) echo "cloudflare: success"; exit 0 ;;
              fail|failure|failed|canceled|cancelled|timed_out|error) echo "cloudflare: $status"; exit 1 ;;
              skipped) echo "cloudflare: skipped, so nothing deployed; see the build in the dashboard"; exit 1 ;;
              "") unknown=$((unknown + 1)); [ "$unknown" -lt 10 ] || { echo "cannot read the status of build $uuid; see the dashboard"; exit 1; } ;;
            esac
            sleep 30
          done
